<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@200;900&amp;family=Space+Mono&amp;display=swap');
      
      .bg { fill: #030712; }
      .font-main { font-family: 'Inter', sans-serif; }
      .font-sys { font-family: 'Space Mono', monospace; }
      
      .vision-quote { font-weight: 900; font-size: 38px; fill: #F8FAFC; letter-spacing: 10px; text-anchor: middle; }
      
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      @keyframes scanDown { 0% { transform: translateY(0); } 100% { transform: translateY(600px); } }
      .scanner { fill: url(#scanGrad); animation: scanDown 5s linear infinite; }
    </style>

    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0" />
      <stop offset="50%" stop-color="#00F5FF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#00F5FF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <rect width="1200" height="150" class="scanner" />

  <!-- Scene 9: Vision -->
  <text x="600" y="240" class="font-main vision-quote">COMPLEXITY IS THE ENEMY.</text>
  <text x="600" y="300" class="font-main vision-quote" fill="#00F5FF">EXECUTION IS EVERYTHING.</text>

  <!-- Scene 10: Footer / Console -->
  <line x1="120" y1="480" x2="1080" y2="480" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <line x1="120" y1="480" x2="220" y2="480" stroke="#00F5FF" stroke-width="2" />
  
  <g transform="translate(120, 520)" class="font-sys" font-size="11" fill="rgba(255,255,255,0.4)">
    <text y="0">SIDAN_OS SYSTEM STATUS: <tspan fill="#10B981">ALL CORES OPTIMAL</tspan></text>
    <text y="20">NODE: COLOMBO / LK [ACTIVE_CONNECTION]</text>
    <text y="40">© 2026 SILUNA NUSAL DANGALLA. <tspan fill="#00F5FF" style="animation: blink 1s step-end infinite">█</tspan></text>
  </g>
</svg>
