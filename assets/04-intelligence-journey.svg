<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      .bg { fill: #030712; }
      .glass { fill: #0B0F19; stroke: rgba(255,255,255,0.05); rx: 8px; }
      .font-main { font-family: system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
      .font-sys { font-family: monospace; }
    </style>
    
    <filter id="glowCyan" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <!-- Scene 7: GitHub Intelligence -->
  <text x="120" y="80" class="font-sys" font-size="10" fill="#2563EB" letter-spacing="4px">04 // GITHUB INTELLIGENCE DASHBOARD</text>
  <line x1="120" y1="100" x2="1080" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <rect x="120" y="99" width="60" height="3" fill="#2563EB" />

  <rect x="120" y="140" width="580" height="380" class="glass" />
  <g transform="translate(120, 140)">
    <text x="30" y="40" class="font-sys" font-size="12" fill="#F8FAFC" font-weight="700">COMMIT PULSE &amp; REPOSITORY RADAR</text>
    
    <!-- Radar Chart Background Rings -->
    <circle cx="300" cy="220" r="120" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <circle cx="300" cy="220" r="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    <circle cx="300" cy="220" r="40" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    
    <!-- Data Polygon -->
    <polygon points="300,120 380,180 340,290 260,260 210,190" fill="rgba(37, 99, 235, 0.2)" stroke="#2563EB" stroke-width="2" />
    
    <!-- Labels -->
    <text x="300" y="85" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">SYSTEM C++</text>
    <text x="440" y="225" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">AOSP / KOTLIN</text>
    <text x="300" y="360" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">SWIFT SEC</text>
    <text x="160" y="225" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">ARCH LINUX</text>
  </g>

  <!-- Activity Timeline -->
  <rect x="720" y="140" width="360" height="380" class="glass" />
  <g transform="translate(720, 140)">
    <text x="30" y="40" class="font-sys" font-size="12" fill="#F8FAFC" font-weight="700">CONTRIBUTION TIMELINE</text>
    
    <!-- Graph Line and Fill -->
    <path d="M 30 200 L 70 170 L 110 220 L 150 140 L 190 190 L 230 110 L 270 150 L 310 80 L 330 130" fill="none" stroke="#10B981" stroke-width="2" />
    <path d="M 30 200 L 70 170 L 110 220 L 150 140 L 190 190 L 230 110 L 270 150 L 310 80 L 330 130 L 330 380 L 30 380 Z" fill="rgba(16, 185, 129, 0.1)" />
    
    <text x="30" y="320" class="font-main" font-size="28" font-weight="900" fill="#F8FAFC">1.2K+</text>
    <text x="30" y="340" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)">SYSTEM COMMITS (YTD)</text>
  </g>

  <!-- Scene 8: Engineering Journey -->
  <text x="120" y="580" class="font-sys" font-size="10" fill="#00F5FF" letter-spacing="4px">05 // ENGINEERING JOURNEY</text>
  <line x1="120" y1="600" x2="1080" y2="600" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <rect x="120" y="599" width="60" height="3" fill="#00F5FF" />

  <g transform="translate(120, 660)">
    <line x1="100" y1="0" x2="800" y2="0" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <line x1="100" y1="0" x2="450" y2="0" stroke="#00F5FF" stroke-width="2" />
    
    <circle cx="100" cy="0" r="6" fill="#111827" stroke="#00F5FF" stroke-width="2" />
    <text x="100" y="30" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">SLTC</text>
    <text x="100" y="45" class="font-main" font-weight="700" font-size="12" fill="#F8FAFC" text-anchor="middle">Undergraduate</text>
    
    <circle cx="450" cy="0" r="8" fill="#00F5FF" filter="url(#glowCyan)">
      <animate attributeName="r" values="6; 10; 6" dur="3s" repeatCount="indefinite" />
    </circle>
    <text x="450" y="-20" class="font-sys" font-size="10" fill="#00F5FF" text-anchor="middle">PRESENT</text>
    <text x="450" y="30" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">ARCHTITAN OS</text>
    <text x="450" y="45" class="font-main" font-weight="700" font-size="12" fill="#F8FAFC" text-anchor="middle">Flagship Ecosystem Dev</text>

    <circle cx="800" cy="0" r="6" fill="#111827" stroke="rgba(255,255,255,0.2)" stroke-width="2" />
    <text x="800" y="30" class="font-sys" font-size="10" fill="rgba(255,255,255,0.3)" text-anchor="middle">FUTURE</text>
    <text x="800" y="45" class="font-main" font-weight="700" font-size="12" fill="rgba(255,255,255,0.3)" text-anchor="middle">Production Infrastructure</text>
  </g>
</svg>
