<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100;200;400;700;900&amp;family=Space+Mono&amp;display=swap');
      
      .bg { fill: #030712; }
      .text-glow { filter: drop-shadow(0 0 15px rgba(0, 245, 255, 0.45)); }
      .font-main { font-family: 'Inter', sans-serif; }
      .font-sys { font-family: 'Space Mono', monospace; }
      
      .hero-title { font-weight: 900; font-size: 82px; fill: #F8FAFC; letter-spacing: 24px; text-anchor: middle; }
      .hero-sub { font-weight: 200; font-size: 16px; fill: #00F5FF; letter-spacing: 16px; text-anchor: middle; }
      
      @keyframes slowSpin { 100% { transform: rotate(360deg); } }
      @keyframes reverseSpin { 100% { transform: rotate(-360deg); } }
      @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
      
      /* Cinematic Title Sequence */
      @keyframes s1 { 0%, 15% { opacity: 1; transform: scale(1); filter: blur(0); } 20%, 100% { opacity: 0; transform: scale(1.05); filter: blur(10px); } }
      @keyframes s2 { 0%, 20% { opacity: 0; } 25%, 35% { opacity: 1; transform: scale(1); filter: blur(0); } 40%, 100% { opacity: 0; transform: scale(1.05); filter: blur(10px); } }
      @keyframes s3 { 0%, 40% { opacity: 0; } 45%, 55% { opacity: 1; transform: scale(1); filter: blur(0); } 60%, 100% { opacity: 0; transform: scale(1.05); filter: blur(10px); } }
      @keyframes s4 { 0%, 60% { opacity: 0; } 65%, 75% { opacity: 1; transform: scale(1); filter: blur(0); } 80%, 100% { opacity: 0; transform: scale(1.05); filter: blur(10px); } }
      @keyframes s5 { 0%, 80% { opacity: 0; filter: blur(10px); } 85%, 100% { opacity: 1; transform: scale(1); filter: blur(0); } }
      
      .orbit-1 { transform-origin: center; animation: slowSpin 60s linear infinite; }
      .orbit-2 { transform-origin: center; animation: reverseSpin 80s linear infinite; }
    </style>
    
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5FF" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#2563EB" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="100%" height="100%" class="bg" />
  
  <circle cx="600" cy="350" r="400" fill="url(#coreGlow)" />
  
  <g class="orbit-1">
    <circle cx="600" cy="350" r="300" fill="none" stroke="rgba(0, 245, 255, 0.1)" stroke-width="1" />
    <path d="M 600 50 A 300 300 0 0 1 900 350" fill="none" stroke="#00F5FF" stroke-width="2" class="text-glow" />
    <circle cx="600" cy="50" r="3" fill="#00F5FF" />
  </g>
  
  <g class="orbit-2">
    <circle cx="600" cy="350" r="380" fill="none" stroke="rgba(124, 58, 237, 0.15)" stroke-width="1" stroke-dasharray="4 12" />
    <circle cx="220" cy="350" r="2" fill="#7C3AED" />
  </g>

  <!-- Boot Terminal -->
  <g transform="translate(40, 40)" class="font-sys" font-size="11" fill="rgba(255,255,255,0.4)">
    <text y="0">ARCHTITAN_OS v1.0.0 [WAYLAND_TARGET]</text>
    <text y="16">INITIATING CORE DAEMONS...</text>
    <text y="32" fill="#00F5FF">MOUNTING ENCRYPTED VOLUMES [OK]</text>
    <text y="48">ESTABLISHING KERNEL IPC <tspan style="animation: blink 1s step-end infinite">_</tspan></text>
  </g>

  <!-- Cinematic Identity Sequence -->
  <g transform="translate(600, 370)">
    <g style="animation: s1 24s infinite; transform-origin: center;">
      <text y="-40" class="font-main hero-sub">SYSTEM SOFTWARE ENGINEER</text>
      <text y="40" class="font-main hero-title text-glow">SIDAN</text>
    </g>
    <g style="animation: s2 24s infinite; transform-origin: center;">
      <text y="-40" class="font-main hero-sub">AOSP / KERNEL</text>
      <text y="40" class="font-main hero-title">ANDROID</text>
    </g>
    <g style="animation: s3 24s infinite; transform-origin: center;">
      <text y="-40" class="font-main hero-sub">LOW-LEVEL ARCHITECTURE</text>
      <text y="40" class="font-main hero-title text-glow">LINUX</text>
    </g>
    <g style="animation: s4 24s infinite; transform-origin: center;">
      <text y="-40" class="font-main hero-sub">PERFORMANCE / SECURITY</text>
      <text y="40" class="font-main hero-title">ENGINEER</text>
    </g>
    <g style="animation: s5 24s infinite forwards; transform-origin: center;">
      <text y="-40" class="font-main hero-sub">SILUNA NUSAL DANGALLA</text>
      <text y="40" class="font-main hero-title text-glow">SIDAN</text>
    </g>
  </g>

  <!-- Scene 3: Mission -->
  <g transform="translate(600, 750)" text-anchor="middle">
    <text y="0" class="font-main" font-weight="200" font-size="24" fill="#F8FAFC" letter-spacing="6px">CONTEXT-AWARE PROACTIVE SYSTEM INTEGRATION.</text>
    <text y="40" class="font-main" font-weight="200" font-size="24" fill="#00F5FF" letter-spacing="6px">ENGINEERING THE FOUNDATION OF TOMORROW.</text>
    <circle cx="0" cy="80" r="3" fill="#00F5FF" class="text-glow" />
    <line x1="0" y1="95" x2="0" y2="150" stroke="rgba(255,255,255,0.1)" stroke-width="1" />
  </g>
</svg>
