<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;family=Space+Mono&amp;display=swap');
      
      .bg { fill: #030712; }
      .glass { fill: #0B0F19; stroke: rgba(255,255,255,0.05); rx: 8px; }
      .font-main { font-family: 'Inter', sans-serif; }
      .font-sys { font-family: 'Space Mono', monospace; }
      
      @keyframes packet { 0% { stroke-dashoffset: 300; } 100% { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%, 100% { fill: rgba(0,245,255,0.1); } 50% { fill: rgba(0,245,255,0.5); filter: drop-shadow(0 0 15px #00F5FF); } }
      
      .data-line { fill: none; stroke: rgba(255,255,255,0.2); stroke-width: 1.5; stroke-dasharray: 4 296; stroke-dashoffset: 300; animation: packet 3s linear infinite; }
      .node-core { animation: pulse 4s infinite; }
      .glow-blue { filter: drop-shadow(0 0 10px #2563EB); }
    </style>
  </defs>

  <rect width="100%" height="100%" class="bg" />

  <text x="120" y="80" class="font-sys" font-size="10" fill="#F8FAFC" letter-spacing="4px">03 // MACRO ARCHITECTURE &amp; ECOSYSTEM PROJECTS</text>
  <line x1="120" y1="100" x2="1080" y2="100" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
  <rect x="120" y="99" width="60" height="3" fill="#F8FAFC" />

  <rect x="120" y="140" width="960" height="660" class="glass" />

  <g transform="translate(120, 140)">
    <!-- Neural Grid Background -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
    <rect width="960" height="660" fill="url(#grid)" rx="8" />

    <!-- Core Paths -->
    <path id="p1" d="M 480 330 L 240 180" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
    <path id="p2" d="M 480 330 L 720 180" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
    <path id="p3" d="M 480 330 L 240 480" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
    <path id="p4" d="M 480 330 L 720 480" stroke="rgba(255,255,255,0.05)" stroke-width="2" />
    <path id="p5" d="M 480 330 L 480 120" stroke="rgba(255,255,255,0.05)" stroke-width="2" />

    <!-- Data Packets -->
    <use href="#p1" class="data-line" style="stroke: #F59E0B;" />
    <use href="#p2" class="data-line" style="stroke: #10B981; animation-delay: 1s;" />
    <use href="#p3" class="data-line" style="stroke: #EF4444; animation-delay: 0.5s;" />
    <use href="#p4" class="data-line" style="stroke: #7C3AED; animation-delay: 1.5s;" />
    <use href="#p5" class="data-line" style="stroke: #2563EB; animation-delay: 0.2s;" />

    <!-- CORE NODE: SIDAN ECOSYSTEM -->
    <circle cx="480" cy="330" r="60" class="node-core" />
    <circle cx="480" cy="330" r="30" fill="#111827" stroke="#00F5FF" stroke-width="3" class="glow-blue" />
    <text x="480" y="335" class="font-main" font-weight="900" font-size="14" fill="#F8FAFC" text-anchor="middle" letter-spacing="2px">SIDAN</text>
    <text x="480" y="420" class="font-sys" font-size="12" fill="#00F5FF" text-anchor="middle">MACRO ECOSYSTEM</text>

    <!-- NODE 1: AeroLang -->
    <circle cx="240" cy="180" r="24" fill="#111827" stroke="#F59E0B" stroke-width="2" />
    <text x="240" y="140" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">AEROLANG</text>
    <text x="240" y="225" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Sole Owner &amp; Architect</text>
    <text x="240" y="240" class="font-sys" font-size="10" fill="#F59E0B" text-anchor="middle">Custom C++ Compiler</text>

    <!-- NODE 2: PrivacyShieldMac -->
    <circle cx="720" cy="180" r="24" fill="#111827" stroke="#10B981" stroke-width="2" />
    <text x="720" y="140" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">PRIVACYSHIELDMAC</text>
    <text x="720" y="225" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">macOS Background Daemon</text>
    <text x="720" y="240" class="font-sys" font-size="10" fill="#10B981" text-anchor="middle">Vision Framework</text>

    <!-- NODE 3: GameModeX -->
    <circle cx="240" cy="480" r="24" fill="#111827" stroke="#EF4444" stroke-width="2" />
    <text x="240" y="440" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">GAMEMODEX</text>
    <text x="240" y="525" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Android System Launcher</text>
    <text x="240" y="540" class="font-sys" font-size="10" fill="#EF4444" text-anchor="middle">4K60fps &amp; Thermal</text>

    <!-- NODE 4: ByBridge -->
    <circle cx="720" cy="480" r="24" fill="#111827" stroke="#7C3AED" stroke-width="2" />
    <text x="720" y="440" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">BYBRIDGE</text>
    <text x="720" y="525" class="font-sys" font-size="10" fill="rgba(255,255,255,0.5)" text-anchor="middle">Cross-Device Ecosystem</text>
    <text x="720" y="540" class="font-sys" font-size="10" fill="#7C3AED" text-anchor="middle">Linux IPC Sockets</text>

    <!-- NODE 5: LankaSmartMart -->
    <circle cx="480" cy="120" r="24" fill="#111827" stroke="#2563EB" stroke-width="2" />
    <text x="480" y="80" class="font-main" font-weight="700" font-size="14" fill="#F8FAFC" text-anchor="middle">LANKASMARTMART</text>
    <text x="480" y="165" class="font-sys" font-size="10" fill="#2563EB" text-anchor="middle">Jetpack Compose / Firebase</text>

  </g>
</svg>
